# KiroCrew Flow — Exemplo de configuração de squad
# Copie este arquivo, renomeie para squads/<seu-id>.yaml e ajuste.
# Arquivos prefixados com "_" e o próprio "example.yaml" são ignorados no load.

id: example-squad
name: Squad Exemplo

# Provedor de issues (default da squad): "github" ou "jira".
# Azure DevOps: apenas SCM (repos[].url), NUNCA issue_provider.
# Providers de issue suportados: github | jira.
issue_provider: jira

# Jira: chave do projeto
# GitHub: owner/repo
project: VGAT

# Repositórios conhecidos pela squad.
# Dupla função:
#   1. Projetos a varrer no scan (GitHub-first; Jira usa "project" acima)
#   2. Lista de validação do título: [repo] no título deve casar aqui
#      Typo falha alto: [api-gatewy2] não casa → recusa em vez de despachar errado
# Forma simples (string) — herda todos os flags globais:
#   repos:
#     - org/api-gateway2
#     - org/api-subscription2
#
# Forma inline com flags por repo (issue #264) — cada entrada é um mapa com
# url (obrigatório) e, opcionalmente, auto_dispatch / auto_merge. Omitir um
# flag = herda o global (auto_dispatch do deployment.config.yaml e
# auto_merge_on_approve do workflow_params abaixo). Aceita URLs completas
# (github.com, dev.azure.com, ...) ou o formato owner/repo — o parser
# normaliza a url para o identificador que o scanner/provider consome
# (github.com/owner/repo → owner/repo; dev.azure.com/org/proj/_git/repo →
# org/proj/repo), de modo que a URL crua nunca chega ao scanner.
#
# issue_provider por repo (override por-repo, issue #311) — cada entrada de
# `repos:` aceita `issue_provider: github | jira` para sobrescrever o default
# da squad (o `issue_provider` do raiz acima). Omitir = herda o default.
# Precedência: override por-repo > default da squad. Útil quando a squad usa
# Jira como tracker padrão, mas um repo específico tem suas issues no GitHub.
# Lembrete: Azure DevOps é SCM-only — nunca aceita issue_provider.
# Exemplo (default da squad = jira):
#   repos:
#     - url: https://github.com/eliasrosa/kirocrew-flow
#       issue_provider: github   # override: este repo usa GitHub Issues
#     - url: https://dev.azure.com/kdop/PlataformaCogna-MKTP-MVP/_git/api-subscription2
#       # sem issue_provider → herda jira do raiz (Azure DevOps entra só como SCM)
repos:
  - url: https://github.com/org/api-gateway2
    auto_dispatch: true
    auto_merge: false   # merge manual em PRD, mesmo com auto_merge_on_approve global
  - url: https://dev.azure.com/kdop/PlataformaCogna-MKTP-MVP/_git/api-subscription2
    auto_dispatch: true
    auto_merge: true

# Template de workflow — Fase 1 = fixo, Fase 3 = editável no canvas
# versao-c (padrão) = review ANTES do QA, sequencial
# versao-a         = review DEPOIS do QA
# versao-b         = review em PARALELO com QA
workflow_template: versao-c

# Parâmetros do template configuráveis por squad
workflow_params:
  # merge_mode: "manual" (único valor implementado na Fase 1)
  # auto-merge é item futuro — o motor nunca mergeia
  merge_mode: manual
  # review_position: before_qa | after_qa | parallel_qa
  review_position: before_qa
  # deploy_hml_mode: "manual" (único valor implementado na Fase 1)
  deploy_hml_mode: manual
  # allow_hml_bypass: hotfix pode ir direto pra PRD (exige justificativa)
  allow_hml_bypass: true
  # auto_merge_on_approve: merge squash automático após reviewer aprovar sem comentários.
  #   false (default) — para em crewflow:reviewed aguardando merge manual (mais seguro para POC)
  #   true            — merge squash automático + delete branch + crewflow:done
  auto_merge_on_approve: false

# Configuração por repositório (forma LEGADA, issue #245) — equivalente à forma
# inline em `repos:` acima. Substitui as flags globais auto_dispatch e
# auto_merge_on_approve para repos específicos. Campos opcionais: omita para
# herdar o valor global. Precedência: se o mesmo repo aparecer aqui E inline
# em `repos:`, a entrada inline de `repos:` vence.
# repos_config:
#   - name: org/api-gateway2
#     auto_dispatch: true
#     auto_merge: false   # merge manual neste repo, mesmo com auto_merge_on_approve: true global
#   - name: org/api-subscription2
#     auto_dispatch: true
#     auto_merge: true

# Regras de routing: issue com estas labels → usa este workflow
# Avaliadas em ordem; a primeira que casar é usada.
# O "default" é o fallback quando nenhuma regra casar.
routing:
  - match: {labels: ["flow:hotfix"]}
    workflow: hotfix-flow
  - match: {labels: ["flow:bug"]}
    workflow: bug-flow
  - match: {labels: ["flow:debt"]}
    workflow: debt-flow
  - match: {labels: ["flow:feature"]}
    workflow: feature-flow
  - default: feature-flow
