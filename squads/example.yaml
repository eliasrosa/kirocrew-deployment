# KiroCrew Flow — Exemplo de configuração de squad
# Copie este arquivo, renomeie para squads/<seu-id>.yaml e ajuste.
# Arquivos prefixados com "_" e o próprio "example.yaml" são ignorados no load.

id: example-squad
name: Squad Exemplo

# Provedor de issues: "github" ou "jira"
issue_provider: jira

# Jira: chave do projeto
# GitHub: owner/repo
project: VGAT

# Repositórios conhecidos pela squad.
# Dupla função:
#   1. Projetos a varrer no scan (GitHub-first; Jira usa "project" acima)
#   2. Lista de validação do título: [repo] no título deve casar aqui
#      Typo falha alto: [api-gatewy2] não casa → recusa em vez de despachar errado
#
# Repositórios GitHub (padrão — scm omitido):
repos:
  - org/api-gateway2
  - org/api-subscription2
#
# Repositórios Azure DevOps — opção 1: campos explícitos (recomendado)
# repos:
#   - name: kdop/api-gateway2
#     scm: azure_devops
#     azure_org: https://dev.azure.com/kdop
#     azure_project: PlataformaCogna-MKTP-MVP
#     azure_repo: voomp-creators-api-gateway2
#
# Repositórios Azure DevOps — opção 2: detecção automática pela URL
# O campo scm é inferido quando o nome começa com dev.azure.com
# Formato: dev.azure.com/<org>/<project>/<repo> (com ou sem https://)
# repos:
#   - name: dev.azure.com/kdop/PlataformaCogna-MKTP-MVP/voomp-creators-api-gateway2
#   - name: https://dev.azure.com/kdop/PlataformaCogna-MKTP-MVP/voomp-creators-api-subscription2

# Template de workflow — Fase 1 = fixo, Fase 3 = editável no canvas
# versao-c (padrão) = review ANTES do QA, sequencial
# versao-a         = review DEPOIS do QA
# versao-b         = review em PARALELO com QA
workflow_template: versao-c

# Parâmetros do template configuráveis por squad
workflow_params:
  # merge_mode: "manual" (único valor implementado na Fase 1)
  # auto-merge é item futuro — o motor nunca mergeia
  merge_mode: manual
  # review_position: before_qa | after_qa | parallel_qa
  review_position: before_qa
  # deploy_hml_mode: "manual" (único valor implementado na Fase 1)
  deploy_hml_mode: manual
  # allow_hml_bypass: hotfix pode ir direto pra PRD (exige justificativa)
  allow_hml_bypass: true
  # auto_merge_on_approve: merge squash automático após reviewer aprovar sem comentários.
  #   false (default) — para em crewflow:reviewed aguardando merge manual (mais seguro para POC)
  #   true            — merge squash automático + delete branch + crewflow:done
  auto_merge_on_approve: false

# Configuração por repositório — substitui as flags globais auto_dispatch e
# auto_merge_on_approve para repos específicos. Útil quando a squad tem repos
# com políticas diferentes (ex: merge manual num repo crítico, automático no outro).
# Campos opcionais: omita para herdar o valor global.
# repos_config:
#   - name: org/api-gateway2
#     auto_dispatch: true
#     auto_merge: false   # merge manual neste repo, mesmo com auto_merge_on_approve: true global
#   - name: org/api-subscription2
#     auto_dispatch: true
#     auto_merge: true

# Regras de routing: issue com estas labels → usa este workflow
# Avaliadas em ordem; a primeira que casar é usada.
# O "default" é o fallback quando nenhuma regra casar.
routing:
  - match: {labels: ["flow:hotfix"]}
    workflow: hotfix-flow
  - match: {labels: ["flow:bug"]}
    workflow: bug-flow
  - match: {labels: ["flow:debt"]}
    workflow: debt-flow
  - match: {labels: ["flow:feature"]}
    workflow: feature-flow
  - default: feature-flow
