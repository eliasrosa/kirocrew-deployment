# KiroCrew Flow — squad de auto-teste
# O próprio repo como cobaia do motor.
id: kirocrew-flow
name: KiroCrew Flow (auto-teste)
issue_provider: github

# O repo sob monitoramento.
# Forma inline (issue #264): cada entrada pode ser um mapa com url/auto_dispatch/
# auto_merge, sobrepondo os defaults globais por repo. Omitir um flag = herda o
# global (auto_dispatch do deployment.config.yaml e auto_merge_on_approve abaixo).
# A `url` pode ser a URL completa (github.com/...) ou o formato owner/repo: o
# parser a normaliza para o identificador owner/repo que o scanner/provider usa.
repos:
  - url: https://github.com/eliasrosa/kirocrew-flow
    auto_dispatch: true
    auto_merge: true

workflow_template: versao-c

workflow_params:
  merge_mode: manual
  review_position: before_qa
  deploy_hml_mode: manual
  allow_hml_bypass: true
  auto_merge_on_approve: true  # opt-in: reviewer aprova sem comentários → merge squash automático

routing:
  - match: {labels: ["flow:hotfix"]}
    workflow: hotfix-flow
  - match: {labels: ["flow:bug"]}
    workflow: bug-flow
  - match: {labels: ["flow:debt"]}
    workflow: debt-flow
  - match: {labels: ["flow:feature"]}
    workflow: feature-flow
  - default: feature-flow

# Forma legada equivalente (issue #245) — mantida apenas como referência.
# Se o mesmo repo aparecer aqui e inline em `repos:`, a entrada inline vence.
# repos_config:
#   - name: eliasrosa/kirocrew-flow
#     auto_dispatch: true
#     auto_merge: true
