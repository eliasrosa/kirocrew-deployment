[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kirocrew-flow"
version = "1.0.0"
description = "KiroCrew Flow — orquestração de esteira de desenvolvimento multi-squad"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0",  # parser YAML completo; recomendado para squads com routing complexo
]
dotenv = [
    "python-dotenv>=1.0",  # carrega .env automaticamente; opcional — sem ele os secrets vêm só do env
]
gateway = [
    "kirocrew-client>=0.1",  # SDK do Crew Gateway — instalado só no ambiente do gateway; ausente no PyPI público, por isso fora do dev/CI
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=2.0",
    "ruff>=0.5",
    "pyyaml>=6.0",  # parser YAML completo; sem ele, _mini_yaml é o fallback
    "python-dotenv>=1.0",  # carregamento de .env nos testes de integração
]

[tool.pytest.ini_options]
testpaths = ["flow/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["flow"]
omit = ["flow/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",  # stubs dos adapters são esperados
    "if __name__ == .__main__.",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Não usamos --strict: os adapters usam `dict` genérico intencionalmente e
# os modules-como-Protocol têm type: ignore nos locais corretos.
# Verificações ativas: erros de tipo real (incompatível, union-attr, etc).
check_untyped_defs = true
warn_unused_ignores = false
warn_return_any = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PLW",  # pylint warnings
]
ignore = [
    "E501",   # linha muito longa (controlado pelo formatter)
]

[tool.ruff.lint.per-file-ignores]
"flow/tests/*" = ["S101"]  # assert é ok em testes

[tool.setuptools.packages.find]
where = ["."]
include = ["flow*"]

# ---------------------------------------------------------------------------
# python-semantic-release — release engineering da issue #247.
#
# A release é dirigida pelos conventional commits já usados no repo
# (feat -> minor, fix -> patch, breaking -> major) e roda no CI (GitHub
# Actions) no push para `main` — nunca localmente no sandbox. Ver a política
# completa em docs/RELEASE.md.
#
# Fontes de verdade da versão (docs/RELEASE.md → "Fontes de verdade"):
#   - pyproject.toml [project].version  → estampado por `version_toml`.
#   - app.json "version"                → sincronizado pelo `build_command`
#     (scripts/sync_app_version.py), porque o semantic-release não carimba uma
#     chave JSON arbitrária diretamente.
# ---------------------------------------------------------------------------
[tool.semantic_release]
# Fonte de verdade da versão: [project].version no próprio pyproject.toml.
version_toml = ["pyproject.toml:project.version"]
# Branch de release.
branch = "main"
# Parser de conventional commits (feat/fix/BREAKING CHANGE) — padrão do tool.
commit_parser = "conventional"
# Mensagem do commit de release (com [skip ci] para não re-disparar o CI).
commit_message = "chore(release): {version}\n\nAutomated release [skip ci]"
# Propaga a nova versão para o app.json depois de o pyproject.toml ser estampado.
# $NEW_VERSION é exportado pelo semantic-release durante o build_command.
build_command = "python scripts/sync_app_version.py \"$NEW_VERSION\""
# Ativos extras incluídos no commit de release (além do pyproject.toml e do
# CHANGELOG): o app.json sincronizado pelo build_command acima.
assets = ["app.json"]
# Tags no formato vX.Y.Z.
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
# Tipos que disparam um bump minor (novas funcionalidades).
minor_tags = ["feat"]
# Tipos que disparam um bump patch (correções compatíveis para trás).
patch_tags = ["fix", "perf"]
# Tokens de rodapé que forçam um bump major (breaking change).
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "docs",
    "style",
    "refactor",
    "test",
    "ci",
    "chore",
    "build",
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
# Gera/atualiza o CHANGELOG.md na raiz a cada release.
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
# VCS remoto: GitHub. Cria a tag e a GitHub Release usando o GITHUB_TOKEN.
type = "github"

[tool.semantic_release.publish]
# Faz upload dos artefatos/dist para a GitHub Release quando existirem.
upload_to_vcs_release = true
