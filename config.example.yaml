# KiroCrew Flow — configuração de exemplo
# Copie para deployment.config.yaml e ajuste. NÃO commite o config real (está no .gitignore).

# Repositórios vigiados (owner/repo). A esteira varre todos procurando issues
# com o estado `crewflow:todo`.
repos:
  - owner/repo-a
  - owner/repo-b

# Para onde vão as notificações (Telegram chat_id do dono, ou de um canal dedicado).
# Deixe vazio para não notificar por voz/DM.
notify_chat_id: "<SEU_CHAT_ID>"

# Disparo automático:
#   false = a vigia só AVISA quando há issue em `crewflow:todo` (você aciona manual)
#   true  = dispara uma sessão one-shot que implementa, abre o PR e encerra
auto_dispatch: false

# ── Configuração de squad (opcional mas recomendado) ──────────────────────
# Caminho para um arquivo squads/*.yaml. Se fornecido, a squad config é
# carregada dele (routing declarativo, workflow_params, etc.). Caso contrário,
# o deployment constrói a squad inline com os campos abaixo.
# squad_config: /path/to/squads/my-squad.yaml

# Identificador da squad (usado no nome do cache SQLite)
# squad_id: cogna-gateway

# Parâmetros do template (configuráveis por squad)
workflow_params:
  # merge_mode: SEMPRE manual na Fase 1. `auto` está no radar (futuro) e ainda
  # NÃO é implementado — o motor nunca mergeia.
  merge_mode: manual               # manual | auto (futuro)
  review_position: before_qa       # before_qa (Versão C) | after_qa (A) | parallel_qa (B)
  deploy_hml_mode: manual          # manual | auto (futuro)

# Limites de segurança
max_concurrent_tasks: 2  # máx de tasks em paralelo ao mesmo tempo (global; alias: max_concurrent)
max_turns_per_task: 60   # teto duro de turnos por sessão disparada
one_per_repo: true       # no máx 1 sessão ativa por repo

# Customização do prompt de dispatch (opcional)
# Texto adicional appendado ao final do prompt base enviado à sessão one-shot.
# Útil para instruções específicas da squad (stack, convenções, steerings extras).
# Exemplo:
# dispatch_prompt_extra: |
#   Convenções desta squad:
#   - Use sempre `make test` em vez de `pytest` direto.
#   - Commits em pt-BR com prefixo convencional.
#   - Steering em /home/elias/dev/cogna/.kiro/steering/ tem regras adicionais.

# Modo dry-run: inspeciona o que o motor faria sem executar nenhuma ação.
# Útil para validar a configuração da squad antes de ativar o dispatch.
# Ativado por esta flag ou pela variável de ambiente CREWFLOW_DRY_RUN=1.
#
# Exemplo de saída:
#   [DRY-RUN] owner/repo#73 → DISPATCH_DEV (template via executor) — [repo] feat: dry-run
#   [DRY-RUN] owner/repo#74 → NOTIFY_HUMAN tl ([repo] Fix: aguarda gate-tl)
#   [DRY-RUN] Nenhuma sessão despachada, label alterada ou notificação enviada.
#
# dry_run: false

# Onde ficam os clones locais usados como base dos worktrees (sem reclonar).
# A esteira cria worktrees isolados em <dev_root>/.esteira-worktrees/<repo>-<n>.
dev_root: "/home/<USER>/dev"

# Caminho do vault Obsidian para espelhar o progresso (opcional; vazio = não espelha).
vault_root: ""

# Agente do Kiro Crew usado nas sessões one-shot.
agent: "kirocrew"
