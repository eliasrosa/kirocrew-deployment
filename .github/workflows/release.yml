name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write  # criar tags e releases
  issues: write    # fechar issues via release notes

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Só executa quando não é commit do próprio semantic-release
    # (evita loop infinito em releases automáticos)
    if: "!contains(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo para calcular o bump correto
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check flow/

      - name: Type check (mypy)
        run: python -m mypy flow/ --ignore-missing-imports

      - name: Tests
        run: python -m pytest flow/tests/ --cov=flow --cov-fail-under=75

      - name: Set up Node.js (semantic-release)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/changelog@6 \
            @semantic-release/exec@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            conventional-changelog-conventionalcommits@8

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
