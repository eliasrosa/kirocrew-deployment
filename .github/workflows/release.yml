name: Release

# Release engineering da issue #247 — ver docs/RELEASE.md.
#
# Roda no push para `main` (depois que o CI de qualidade passa) e usa o
# python-semantic-release para: calcular a próxima versão a partir dos
# conventional commits (feat -> minor, fix -> patch, breaking -> major),
# estampar pyproject.toml + app.json, atualizar o CHANGELOG.md, commitar,
# criar a tag vX.Y.Z e a GitHub Release.
#
# Canais (docs/RELEASE.md → "Tags de canal"):
#   - `latest`: acompanha SEMPRE a release mais recente — atualizado
#     automaticamente por este workflow a cada release cortada.
#   - `stable`: versão validada para produção — só avança por ação MANUAL
#     (nunca automaticamente junto com `latest`), coerente com o princípio
#     inviolável "deploy é sempre manual". O app.json aponta para `stable`
#     por padrão (campo "channel").

# GATING NO CI (review v1, item 2): a release NÃO dispara direto no push para
# `main`. Ela roda via `workflow_run` **após** o workflow "CI" concluir, e só
# prossegue se a conclusão do CI foi `success` (ver a guarda `if:` no job). Assim
# um `main` vermelho (ruff/mypy/pytest falhando) nunca corta uma release, e o
# canal `latest` nunca é movido para um build quebrado. O `stable` continua
# manual (nunca é tocado por este workflow).
on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: ["main"]

# A release precisa de contents: write para commitar o bump de versão, mover a
# tag de canal `latest` e criar a tag/Release. O ci.yml mantém contents: read.
permissions:
  contents: write

# Evita releases concorrentes pisando umas nas outras.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    # Só roda se o CI concluiu com SUCESSO e não é o commit de release do bot
    # (o commit de release carrega [skip ci]). Um CI falho => sem release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout (histórico completo para o semantic-release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Faz checkout exatamente do commit que o CI validou (não do topo do
          # branch, que poderia ter avançado enquanto o CI rodava).
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]" python-semantic-release

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Calcula a próxima versão, estampa pyproject.toml + app.json (via
          # build_command scripts/sync_app_version.py), atualiza CHANGELOG.md,
          # commita, cria a tag vX.Y.Z, faz push e cria a GitHub Release.
          python -m semantic_release version
          python -m semantic_release publish

      - name: Update `latest` channel tag
        # `latest` sempre segue a release mais recente. Só roda se uma nova
        # versão foi de fato cortada (existe uma tag vX.Y.Z no HEAD).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -z "${NEW_TAG}" ]; then
            echo "Nenhuma nova tag de versão neste push — canal 'latest' inalterado."
            exit 0
          fi
          echo "Nova release ${NEW_TAG}: movendo o canal 'latest' para o HEAD."
          git tag -f latest "${NEW_TAG}"
          git push --force origin refs/tags/latest
          # NOTA: o canal 'stable' NUNCA é avançado aqui. Promover para 'stable'
          # é uma ação manual/deliberada (ver docs/RELEASE.md), preservando o
          # princípio inviolável de que a produção nunca é auto-quebrada.
