name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  quality:
    name: Lint + Type check + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check flow/

      - name: Type check (mypy)
        run: python -m mypy flow/ --ignore-missing-imports
        # mypy em modo strict em cima de código de adapter/protocol tem falsos
        # positivos conhecidos (módulos como IssueProvider). Roda sem --strict
        # no CI por ora; o objetivo é cobrir os erros reais.

      - name: Boundary test (domain/ isolation)
        run: python -m pytest flow/tests/test_domain_boundary.py -v

      - name: Full test suite with coverage
        run: |
          python -m pytest flow/tests/ \
            --cov=flow \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75
        # 75% de threshold para a Fase 1 — stubs de adapters reduzem a
        # cobertura de linhas. Aumentar conforme os adapters forem implementados.

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
